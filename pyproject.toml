[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toml-deps-checker"
dynamic = ["version"]
description = "Checks a Gradle version catalog against Maven Central and Google Maven."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
toml-deps-checker = "toml_deps_checker.cli:main"

[tool.setuptools.dynamic]
version = { attr = "toml_deps_checker.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
